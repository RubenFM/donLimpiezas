<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Don Limpiezas</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <span class="brand-name">Don Limpiezas</span>
        </div>
        <nav id="nav" class="nav" aria-label="Módulos"></nav>
      </aside>

      <div class="content">
        <div id="admin-banner" class="banner" hidden>
          <span id="admin-banner-text">
            Sin permisos de administrador: algunas categorías y opciones están desactivadas.
          </span>
          <button id="btn-elevate" class="btn small">Reiniciar como administrador</button>
        </div>
        <main id="modules"></main>
      </div>
    </div>

    <dialog id="confirm">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-body"></p>
        <div class="dialog-actions">
          <button value="cancel" class="btn">Cancelar</button>
          <button value="ok" class="btn primary">Continuar</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
