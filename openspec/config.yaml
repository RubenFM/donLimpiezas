schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: Limpio, limpiador de sistema y eliminador de bloatware para Windows 10/11.
  Stack: Tauri 2. Backend en Rust (src-tauri/src), un módulo por capacidad, operaciones
  de sistema vía windows-sys o PowerShell (ps::run, siempre con -EncodedCommand y sin
  ventana). Frontend en TypeScript sin framework + Vite (src/main.ts, src/styles.css),
  una pestaña por capacidad. Interfaz y textos en español.
  Principios: nada destructivo sin previsualización y confirmación; listas cerradas y
  revisadas en vez de entradas arbitrarias; registrar los cambios para poder deshacerlos;
  funcionar sin administrador y deshabilitar lo que lo requiera.
  Desarrollo desde WSL: compilar y ejecutar con las herramientas de Windows
  (cmd.exe /c "cd /d C:\Users\ruben\WebstormProjects\limpio && ...").

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
