[package]
name = "don-limpiezas"
version = "0.1.0"
description = "Limpiador de sistema y eliminador de bloatware para Windows"
edition = "2021"

[lib]
name = "don_limpiezas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell"] }
